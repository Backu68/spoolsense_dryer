; SpoolSense Dryer
; ESP32 DevKitC / ESP32-WROOM-32

[env:dryer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
build_type = release

monitor_speed = 115200
monitor_filters = direct, printable
lib_deps =
	milesburton/DallasTemperature@4.0.5
	paulstoffregen/OneWire@2.3.8
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit SSD1306@2.5.17
	adafruit/Adafruit PN532@1.3.4
	bblanchon/ArduinoJson@7.4.3
	knolleary/PubSubClient@2.8
	
build_flags =
	-DFIRMWARE_VERSION=\"0.1.0\"
	-DBOARD_SPOOLSENSE_DRYER=1
	; Dryer physical shape is selected when this firmware is built/flashed.
	; DRYER_LAYOUT: 0 = vertical shelves, 1 = horizontal bays.
	; Current retrofit: vertical TOP + BOTTOM sharing one chamber.
	-DDRYER_LAYOUT=0
	-DDRYER_STATION_COUNT=2
	-DDRYER_ZONE_COUNT=1

; Compile ONLY the dryer application.
; Inherited SpoolSense scanner source remains available as reference,
; but is not part of this firmware.
build_src_filter =
	-<*>
	+<dryer/*>